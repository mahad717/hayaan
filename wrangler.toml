# Cloudflare Pages configuration
#
# This file is read by `wrangler` CLI for local dev (`wrangler pages dev`) and
# for `wrangler pages deploy` if you prefer CLI deploys. When you connect your
# GitHub repo to Cloudflare Pages via the dashboard, this file is NOT used for
# the dashboard-driven build — you set Build command + Build output directory
# in the dashboard instead. See README.md → "Deploy to Cloudflare Pages".
#
# Dashboard settings (recommended):
#   Framework preset:        Next.js
#   Build command:           bun run build:pages
#   Build output directory:  .vercel/output/static
#   Root directory:           /
#   (Leave "Deploy command" empty — Cloudflare Pages auto-deploys)
#
# Environment variables (Settings → Environment variables):
#   NEXT_PUBLIC_SUPABASE_URL=https://mqyhgyakhfhuctnvezby.supabase.co
#   NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOi... (your anon key)
#   SUPABASE_SERVICE_ROLE_KEY=eyJhbGciOi...    (your service_role secret)
#
# CLI deploy alternative:
#   bun run build:pages
#   npx wrangler pages deploy .vercel/output/static --project-name=hayaan-market

name = "hayaan-market"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages uses [assets] — there is no `main` script entry point
# (the Workers entry is generated by @cloudflare/next-on-pages).
[assets]
directory = ".vercel/output/static"
not_found_handling = "single-page-application"

[vars]
NEXT_PUBLIC_SITE_URL = "https://hayaan-market.pages.dev"
