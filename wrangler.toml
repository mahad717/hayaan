# Cloudflare Workers Builds configuration for Hayaan Market.
#
# This project deploys as a Cloudflare Worker using @cloudflare/next-on-pages
# to translate the Next.js build into a Workers-compatible bundle.
#
# Workers Builds dashboard settings:
#   Build command:    bun run build:pages
#   Deploy command:   npx wrangler deploy
#   Root directory:   /
#   Compatibility flags: nodejs_compat
#
# Environment variables (Settings → Variables and Secrets):
#   NEXT_PUBLIC_SUPABASE_URL=https://mqyhgyakhfhuctnvezby.supabase.co
#   NEXT_PUBLIC_SUPABASE_ANON_KEY=<your anon key>
#   SUPABASE_SERVICE_ROLE_KEY=<your service_role secret>

name = "hayaan-market"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]

# The Worker entry point generated by @cloudflare/next-on-pages.
# This is what `wrangler deploy` uploads as the Worker script.
main = ".vercel/output/static/_worker.js/index.js"

# Static assets — `wrangler deploy` uploads these alongside the Worker.
# The Worker handles Next.js's dynamic routes; static files (HTML, CSS,
# JS chunks, images) are served directly from this directory.
[assets]
directory = ".vercel/output/static"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
NEXT_PUBLIC_SITE_URL = "https://hayaan-market.workers.dev"
