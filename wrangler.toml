# Cloudflare Workers Builds configuration for Hayaan Market.
#
# The app deploys with the official OpenNext Cloudflare adapter
# (@opennextjs/cloudflare) — the supported way to run Next.js on Workers.
# It emits a single Worker bundle plus a static-asset directory:
#   .open-next/worker.js   ← Worker entry (SSR, API routes, /admin guard)
#   .open-next/assets/     ← prerendered pages, /_next/static, public files
#
# NOTE: we previously used @cloudflare/next-on-pages, but that pipeline is
# Cloudflare Pages-only: its `_worker.js` output depends on Pages runtime
# semantics (bare-specifier module resolution + automatic ASSETS binding)
# that `wrangler deploy` on Workers cannot reproduce — every SSR route
# fails at runtime with `No such module "__next-on-pages-dist__/..."`.
#
# Workers Builds dashboard settings:
#   Build command:    bun run build        (runs `opennextjs-cloudflare build`)
#   Deploy command:   npx wrangler deploy
#   Root directory:   /
#   Compatibility flags: nodejs_compat
#
# Environment variables — two DIFFERENT places in the Workers Builds dashboard:
#
#   1. Build → Variables and Secrets (BUILD-time; Next.js inlines NEXT_PUBLIC_*
#      vars into the client bundle — without these the browser-side Supabase
#      client is silently disabled):
#        NEXT_PUBLIC_SUPABASE_URL=https://mqyhgyakhfhuctnvezby.supabase.co
#        NEXT_PUBLIC_SUPABASE_ANON_KEY=<your anon key>
#
#   2. Settings → Variables and Secrets (RUNTIME bindings, read via process.env
#      in the Worker):
#        NEXT_PUBLIC_SUPABASE_URL       (plain text — also in [vars] below)
#        NEXT_PUBLIC_SUPABASE_ANON_KEY  (plain text)
#        SUPABASE_SERVICE_ROLE_KEY      (type: Secret — never ship to the browser)

name = "hayaan-market"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# Worker entry point generated by `opennextjs-cloudflare build`.
main = ".open-next/worker.js"

# Static assets served directly by Cloudflare's asset server.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[observability]
enabled = true

[vars]
NEXT_PUBLIC_SITE_URL = "https://hayaan-market.workers.dev"
NEXT_PUBLIC_SUPABASE_URL = "https://mqyhgyakhfhuctnvezby.supabase.co"
